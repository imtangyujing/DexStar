[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grab"
version = "0.1.0"
description = "GRAB V1 backend-first monorepo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "celery[redis]>=5.4.0",
  "redis>=5.0.0",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "python-jose[cryptography]>=3.3.0",
  "httpx>=0.27.0",
  "boto3>=1.35.0",
  "yt-dlp>=2024.8.6",
  "python-multipart>=0.0.9",
  "librosa>=0.10.2",
  "mutagen>=1.47.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.8",
  "pytest-cov>=5.0.0",
  "anyio>=4.4.0"
]

[tool.setuptools]
packages = [
  "apps.api.app",
  "apps.api.app.api",
  "apps.api.app.api.v1",
  "apps.api.app.core",
  "apps.api.app.services",
  "apps.worker",
  "libs.common"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
