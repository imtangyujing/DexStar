services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    env_file:
      - ../../.env
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  worker:
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
      args:
        ESSENTIA_TF_VERSION: 2.1b6.dev1389
        TEMPO_CNN_MODEL_URL: https://essentia.upf.edu/models/tempo/tempocnn/deeptemp-k16-3.pb
        TEMPO_CNN_MODEL_PATH: /opt/grab/models/deeptemp-k16-3.pb
    env_file:
      - ../../.env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: grab
      POSTGRES_PASSWORD: grab
      POSTGRES_DB: grab
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grab -d grab"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pg_data:
  minio_data:
