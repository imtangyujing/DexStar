<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DexStar MP3</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: #111827;
        --ink: #f9fafb;
        --muted: #9ca3af;
        --line: #243244;
        --brand: #22c55e;
        --danger: #ef4444;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 360px;
        background: var(--bg);
        color: var(--ink);
        font-family: "Segoe UI", "PingFang SC", sans-serif;
      }
      .wrap {
        padding: 14px;
        display: grid;
        gap: 10px;
      }
      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .head h1 {
        margin: 0;
        font-size: 16px;
      }
      .head a {
        color: #86efac;
        text-decoration: none;
        font-size: 12px;
      }
      label {
        font-size: 12px;
        color: var(--muted);
      }
      input, button, select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        font-size: 14px;
        padding: 10px;
        color: var(--ink);
        background: var(--panel);
      }
      input::placeholder {
        color: #64748b;
      }
      button {
        cursor: pointer;
      }
      .primary {
        border: none;
        background: linear-gradient(120deg, #16a34a, var(--brand));
        color: #06240f;
        font-weight: 700;
      }
      .progress {
        width: 100%;
        height: 8px;
        border-radius: 999px;
        background: #0f172a;
        overflow: hidden;
        border: 1px solid #1e293b;
      }
      .progress > div {
        width: 0%;
        height: 100%;
        background: var(--brand);
        transition: width 0.2s ease;
      }
      .status {
        font-size: 12px;
        color: var(--muted);
        min-height: 16px;
      }
      .status.error {
        color: #fca5a5;
      }
      .status.ok {
        color: #86efac;
      }
      .download {
        display: none;
      }
      .download.show {
        display: block;
      }
      .download.error {
        background: #3b0e12;
        border-color: #7f1d1d;
        color: #fecaca;
      }
      .meta {
        font-size: 12px;
        color: #cbd5e1;
        line-height: 1.5;
      }
      .muted {
        font-size: 11px;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="head">
        <h1>DexStar MP3</h1>
        <a href="#" id="openOptions">设置</a>
      </div>

      <div>
        <label for="url">视频链接</label>
        <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." />
      </div>

      <button id="createBtn" class="primary" type="button">创建任务并处理</button>

      <div class="progress">
        <div id="progressFill"></div>
      </div>
      <div id="status" class="status">等待开始</div>

      <button id="downloadBtn" class="download" type="button">下载 MP3</button>
      <div id="meta" class="meta"></div>
      <div class="muted">仅供个人学习使用，请尊重版权。</div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
